# Cổng nội dung chạy trên mọi PR; merge vào main thì deploy.
#
# Không có job nào chạy theo lịch, và đó là chủ đích: lên lịch bài nằm ở
# `meta.date`, còn việc lọc bài chưa tới ngày xảy ra tại từng request trong
# Worker. Bài viết trước cho tuần sau đã nằm sẵn trong bundle từ lần deploy này
# và tự hiện đúng ngày của nó — không cần cron, không cần deploy lại.

name: Xuất bản

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xuat-ban-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Cổng nội dung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache kết quả kiểm link giữa các lần chạy. Công cụ đợi 1 giây giữa hai
      # request tới cùng một host để không tự chuốc 429, nên kho lớn dần là mỗi
      # lần chạy tốn vài phút nếu hỏi lại từ đầu.
      - uses: actions/cache@v4
        with:
          path: content/.link-cache.json
          key: link-cache-${{ hashFiles('content/posts/**/meta.json') }}
          restore-keys: link-cache-

      - run: pip install pytest
      - run: npm ci
      - run: npm run gate

  deploy:
    name: Deploy lên Cloudflare
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      # Manifest là artifact dẫn xuất, không nằm trong git — Worker không đọc
      # được filesystem lúc chạy nên nội dung phải được gộp vào bundle ở đây.
      - run: npm run manifest

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # Kiểm tra bản đã lên thật, không phải bản dựng được trên runner.
  #
  # Hai thứ chỉ hỏng ở ngoài đời và không cổng nào bắt được: đường dẫn asset sai
  # (trang vẫn 200, chỉ là không có CSS), và Cloudflare ghi đè /robots.txt bằng
  # bản quản lý trong dashboard — lúc đó cờ `noindex` trong site.json không tới
  # được bot mà repo hoàn toàn không biết.
  #
  # Job này đỏ nghĩa là site thật đang khác điều repo nói. Nó chạy SAU deploy nên
  # không chặn việc lên bài; nó chỉ không cho sự lệch đó đi qua trong im lặng.
  #
  # Mọi phép kiểm mang `if: always()` và chỉ đọc file đã tải sẵn, nên chúng độc
  # lập với nhau. Lần chạy đầu tiên cho thấy vì sao điều đó cần thiết: bước
  # robots.txt đỏ đã làm hai bước sau bị bỏ qua, tức là một sự cố phía Cloudflare
  # — thứ có thể mất vài ngày mới xử lý xong — che mất đúng những phép kiểm bắt
  # lỗi phía repo.
  kiem-tra-that:
    name: Kiểm tra site thật
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Domain đọc từ site.json chứ không viết cứng: đổi domain vẫn là đổi đúng
      # một giá trị, kể cả với bước kiểm tra này.
      - name: Lấy domain từ site.json
        id: site
        run: |
          url=$(python3 -c "import json; print(json.load(open('site.json'))['url'].rstrip('/'))")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Kiểm tra: $url"

      # Gom mọi lần gọi mạng vào một bước và KHÔNG để bước này đỏ. Mỗi phép kiểm
      # bên dưới chỉ đọc file, nên chúng không kéo nhau ngã theo.
      - name: Tải về những gì cần kiểm
        id: tai
        if: always() && steps.site.outputs.url != ''
        run: |
          url="${{ steps.site.outputs.url }}"
          curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
               -o /tmp/home.html -w '%{http_code}' "$url/" > /tmp/home.code || echo 000 > /tmp/home.code
          curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
               "$url/style.css" > /tmp/css.info || echo '000 -' > /tmp/css.info
          curl -sS -o /tmp/robots.txt -w '%{http_code}' \
               "$url/robots.txt" > /tmp/robots.code || echo 000 > /tmp/robots.code
          slug=$(python3 tools/latest_slug.py)
          echo "$slug" > /tmp/slug
          curl -sS -o /dev/null -w '%{http_code}' \
               "$url/posts/$slug" > /tmp/post.code || echo 000 > /tmp/post.code
          echo "--- /robots.txt đang được phục vụ ---"
          cat /tmp/robots.txt || true
          echo "--- hết ---"

      - name: Trang chủ trả 200
        id: home
        if: always() && steps.tai.conclusion == 'success'
        run: |
          code=$(cat /tmp/home.code)
          echo "HTTP $code"
          test "$code" = "200"

      - name: CSS phục vụ ở /style.css
        id: css
        if: always() && steps.tai.conclusion == 'success'
        run: |
          out=$(cat /tmp/css.info)
          echo "$out"
          case "$out" in
            200*text/css*) ;;
            *) echo "::error::/style.css không phải CSS. Workers ánh xạ assets/ vào GỐC URL — trang vẫn 200 nhưng không có kiểu dáng."; exit 1 ;;
          esac

      - name: robots.txt là bản do Worker sinh
        id: robots_worker
        if: always() && steps.tai.conclusion == 'success'
        run: |
          test "$(cat /tmp/robots.code)" = "200"
          if grep -qi 'content-signal' /tmp/robots.txt; then
            echo "::error::robots.txt đang do Cloudflare quản lý, không phải bản Worker sinh ra. Tắt nó trong dashboard của domain (AI Crawl Control / robots.txt), nếu không cờ noindex trong site.json không tới được bot."
            exit 1
          fi
          echo "Đúng bản Worker."

      # Tách khỏi phép kiểm trên, vì bản robots.txt của Cloudflare CŨNG chứa
      # "Allow: /". Chỉ so nội dung với cờ noindex thì sẽ xanh trong khi file
      # thực chất không phải của Worker — hai phép kiểm bắt hai chuyện khác nhau.
      - name: robots.txt khớp cờ noindex trong site.json
        id: robots_flag
        if: always() && steps.tai.conclusion == 'success'
        run: |
          noindex=$(python3 -c "import json; print(json.load(open('site.json'))['noindex'])")
          echo "site.json noindex = $noindex"
          if [ "$noindex" = "True" ]; then
            grep -q '^Disallow: /' /tmp/robots.txt
          else
            grep -q '^Allow: /' /tmp/robots.txt
            grep -q '^Sitemap: ' /tmp/robots.txt
          fi

      - name: Bài mới nhất mở được
        id: bai
        if: always() && steps.tai.conclusion == 'success'
        run: |
          echo "$(cat /tmp/slug) -> HTTP $(cat /tmp/post.code)"
          test "$(cat /tmp/post.code)" = "200"

      # Đọc được toàn cảnh mà không phải cuộn log, và nói rõ cái nào sửa ở repo
      # còn cái nào sửa ở dashboard.
      - name: Tổng kết
        if: always()
        run: |
          printf '%-42s %s\n' 'Trang chủ trả 200'          '${{ steps.home.outcome }}'
          printf '%-42s %s\n' 'CSS phục vụ ở /style.css'   '${{ steps.css.outcome }}'
          printf '%-42s %s\n' 'robots.txt là bản Worker'   '${{ steps.robots_worker.outcome }}'
          printf '%-42s %s\n' 'robots.txt khớp cờ noindex' '${{ steps.robots_flag.outcome }}'
          printf '%-42s %s\n' 'Bài mới nhất mở được'       '${{ steps.bai.outcome }}'
          if [ '${{ steps.robots_worker.outcome }}' = 'failure' ]; then
            echo
            echo 'Sửa ở dashboard Cloudflare, không sửa được từ repo:'
            echo '  domain nix.no.id.vn -> AI Crawl Control -> tắt robots.txt quản lý'
          fi
